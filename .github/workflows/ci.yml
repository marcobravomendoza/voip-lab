# CI: validate, build, start the lab and run the smoke tests on every push
# and pull request. Runs on a clean GitHub-hosted Ubuntu machine.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:      # manual "Run workflow" button

# Cancel an older run of the same branch when a new commit arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The real .env is never committed: CI uses the example values.
      - name: Create .env from the example
        run: cp .env.example .env

      # docker compose config + shellcheck on every tracked *.sh file.
      # (shellcheck is preinstalled on GitHub's Ubuntu runners.)
      - name: make lint
        run: make lint

  test:
    name: Build and smoke tests
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Create .env from the example
        run: cp .env.example .env

      - name: Read Asterisk version from .env
        id: version
        run: echo "asterisk=$(grep '^LAB_ASTERISK_VERSION=' .env | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # Build the Asterisk image with the GitHub Actions layer cache, so only
      # the first run (or a version change) compiles Asterisk. "load: true"
      # makes the image available to docker compose below.
      - name: Build Asterisk image
        uses: docker/build-push-action@v6
        with:
          context: ./asterisk
          build-args: ASTERISK_VERSION=${{ steps.version.outputs.asterisk }}
          tags: voip-lab/asterisk:${{ steps.version.outputs.asterisk }}
          load: true
          cache-from: type=gha,scope=asterisk
          cache-to: type=gha,scope=asterisk,mode=max

      - name: Build SIPp image
        run: docker compose --profile test build sipp

      - name: Start the lab
        run: make up

      - name: Smoke tests (phase 1)
        run: make test-phase1

      - name: Show logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color asterisk | tail -n 200

      - name: Upload SIPp output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sipp-results
          path: tests/phase1/results/
          if-no-files-found: ignore

      - name: Stop the lab
        if: always()
        run: make down
