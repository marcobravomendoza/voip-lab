; Extensions file
;

; General options to static dialplan, dialplan save command don't write the file 
[general]
static = yes                     ;static file
writeprotect = yes               ;protect the file

; Internal dialplan/extensions
[from-internal]                                        ;dialplan internal
exten => _100[1-3],1,NoOp(Calling to user)             ;match extensions 1001 to 1003
 same => n,Dial(PJSIP/${EXTEN},20,tT)                  ;call to extensions (create b leg), ring 20seg, t/T allow transfer
 same => n,Hangup()                                    ;send BYE
exten => 600,1,NoOp(Starting echo test)                ;match 600 extension
 same => n,Answer()                                    ;send 200 OK and wait for media
 same => n,Wait(1)                                     ;wait 1seg
 same => n,Playback(demo-echotest)                     ;play demo-echotest sound
 same => n,Echo()                                      ;echo tool
 same => n,Playback(demo-echodone)                     ;play demo-echodone
 same => n,Hangup()                                    ;send BYE
exten => 601,1,NoOp(Starting helloworld)               ;match extension 601
 same => n,Answer()                                    ;send 200OK and wait for media
 same => n,Playback(hello-world)                       ;play hello-world
 same => n,Hangup()                                    ;send BYE
exten => _X!,1,NoOp(Other extensions will be rejected) ;match with any other extension
 same => n,Hangup(1)                                   ;Reject calls with cause 1 (404 Not Found)
