; asterisk.conf - core settings, read once at startup (not reloadable).
;
; Syntax used in all Asterisk config files:
;   [section]        starts a section
;   key = value      an option ("=>" is equivalent to "=")
;   ; comment        comments start with a semicolon

[directories]
; Where Asterisk looks for each kind of file. These match the paths chosen
; with ./configure in the Dockerfile; written out here to make them explicit.
astetcdir => /etc/asterisk                 ; config files (rendered by entrypoint.sh)
astmoddir => /usr/lib/asterisk/modules     ; loadable modules (*.so)
astvarlibdir => /var/lib/asterisk          ; variable data
astdbdir => /var/lib/asterisk              ; AstDB (internal SQLite key/value store)
astkeydir => /var/lib/asterisk             ; keys (IAX/DUNDi, not used here)
astdatadir => /var/lib/asterisk            ; sounds/ and moh/ live under this dir
astagidir => /var/lib/asterisk/agi-bin     ; AGI scripts (week 7)
astspooldir => /var/spool/asterisk         ; voicemail, recordings, call files
astrundir => /var/run/asterisk             ; PID file and CLI control socket
astlogdir => /var/log/asterisk             ; log files, CDR CSV, queue_log
astsbindir => /usr/sbin                    ; the asterisk binary

[options]
; Name of this server. It prefixes every call UniqueID (e.g. lab-pbx-1730538000.1),
; which helps when CDRs from several servers end up in one database.
systemname = lab-pbx

; Default verbosity and debug level (CLI and log channels that include them).
; The command line (-vvv) can raise it; "core set verbose N" changes it live.
verbose = 3
debug = 0

; Language for prompts when the channel has none set (sounds/en/...).
defaultlanguage = en

; Keep dangerous dialplan functions (SHELL, FILE...) blocked when they are
; called from external interfaces such as AMI. Secure default, stated explicitly.
live_dangerously = no

; No runuser/rungroup: the container already starts as the unprivileged
; "asterisk" user (USER in the Dockerfile), so there is no root to drop.
