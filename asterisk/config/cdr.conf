; cdr.conf - Call Detail Records (one record per call leg pair).
; Reload with "module reload cdr".

[general]
; Turn CDR generation on.
enable = yes
; Also record calls that were never answered (NO ANSWER, BUSY, FAILED).
; Default is "no"; useful in a lab to see every attempt.
unanswered = yes
; Record congested calls as CONGESTION instead of FAILED.
congestion = yes
; Write each record as soon as the call ends (no batching), so tests can
; check the CSV right away. Production setups often batch for performance.
batch = no

[csv]
; cdr_csv writes /var/log/asterisk/cdr-csv/Master.csv (asterisk_logs volume).
; Times in the container's local time zone (TZ in docker-compose.yml).
usegmtime = no
; Add the channel UniqueID and the userfield as extra columns.
loguniqueid = yes
loguserfield = yes
; One Master.csv only, no extra per-account files.
accountlogs = no
