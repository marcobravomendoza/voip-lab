; rtp.conf - RTP (media) settings used by every channel driver.
; Reload with "module reload res_rtp_asterisk.so".

[general]
; UDP port range for RTP. Must match the range published in docker-compose.yml.
; Each call leg uses one even port for RTP and the next odd one for RTCP,
; so 50 ports = 25 simultaneous call legs, plenty for a lab and cheap to publish.
rtpstart = 10000
rtpend = 10049

; Strict RTP: once a stream is learned, ignore packets from any other source.
; Protects against RTP injection; the same idea as RTPengine "strict source".
strictrtp = yes

; No ICE and no STUN: everything is on one LAN and NAT is handled with
; external_media_address in pjsip.conf.
icesupport = no
