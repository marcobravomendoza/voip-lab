; logger.conf - where log messages go.
; Reload with "logger reload" from the CLI.

[general]
; Timestamp format: ISO date and time with milliseconds.
dateformat = %F %T.%3q

; Tag every line with the call ID of the call that produced it,
; e.g. [C-00000003]. grep by that tag to follow a single call
; (similar to logging $ci in Kamailio).
use_callids = yes

; Do not add the hostname to log file names.
appendhostname = no

; Write queue events to /var/log/asterisk/queue_log (used from week 5).
queue_log = yes

[logfiles]
; Format:  <channel name> => <comma-separated levels>
; Levels: debug, notice, warning, error, verbose, dtmf, security, fax.

; "console" = standard output of the process -> visible with docker logs.
console => notice,warning,error,verbose

; Main log file, kept in the asterisk_logs named volume.
messages.log => notice,warning,error,verbose

; Security events only: failed authentication, unknown endpoints,
; ACL rejections... This is what tools like fail2ban read.
security.log => security
