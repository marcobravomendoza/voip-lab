; features.conf - in-call features triggered by DTMF (transfers, hangup, ...).
; Reload with "module reload features".
;
; A feature code only works if the Dial() that created the call enables it:
;   Dial(...,,tT)  t = callee may transfer, T = caller may transfer
;   Dial(...,,hH)  h = callee may hang up with the disconnect code, H = caller
; Without those options the DTMF is passed through untouched.

[general]
; Seconds to wait for the target number after the transfer code.
transferdigittimeout = 3
; Milliseconds to wait between digits of a feature code.
featuredigittimeout = 1000
; Seconds to wait for the transfer target to answer an attended transfer.
atxfernoanswertimeout = 15

[featuremap]
; Blind transfer: press ## then the target extension.
blindxfer = ##
; Attended transfer: press *2, talk to the target, hang up to complete.
atxfer = *2
; Hang up the call from the keypad.
disconnect = *0
; Start/stop recording the call (MixMonitor, week 6).
automixmon = *3
