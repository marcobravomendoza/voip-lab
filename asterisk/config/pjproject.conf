; pjproject.conf - settings of the pjproject library underneath res_pjsip
; (its own log levels, not the SIP configuration, which is pjsip.conf).
; Defaults are fine. "pjproject set log level 4" in the CLI is useful when
; debugging the SIP stack itself.

[startup]
type = startup
; Log level of pjproject messages at startup (0 = none ... 6 = very verbose).
log_level = default
