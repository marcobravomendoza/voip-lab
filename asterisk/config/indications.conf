; indications.conf - call progress tones Asterisk generates itself
; (Playtones(), Busy(), Congestion(), Dial() with the "r" option, MOH fallback).
; SIP phones usually generate their own ringback on 180 Ringing; these tones are
; only heard when Asterisk plays them in-band.
;
; Tone syntax: frequency/duration_ms, comma separated, repeating.
;   425/200,0/200   = 425 Hz for 200 ms, silence for 200 ms, repeat
;   !               = play once, do not repeat
;   0               = silence

[general]
; Default tone zone for channels that do not set one.
country = es

[es]
description = Spain
; Ring cadence (ms on, ms off) for analog ringing.
ringcadence = 1500,3000
; Dial tone: continuous 425 Hz.
dial = 425
; Busy: 425 Hz, 200 ms on / 200 ms off.
busy = 425/200,0/200
; Ringback: 425 Hz, 1.5 s on / 3 s off.
ring = 425/1500,0/3000
; Congestion (network busy): three short beeps, then a longer pause.
congestion = 425/200,0/200,425/200,0/200,425/200,0/600
; Call waiting beep.
callwaiting = 425/175,0/175,425/175,0/3500
; Recall dial tone: three beeps, then continuous tone.
dialrecall = !425/200,!0/200,!425/200,!0/200,!425/200,!0/200,425
; Recording warning beep.
record = 1400/500,0/15000
; Special information tone.
info = 950/330,0/1000
; Second dial tone (e.g. after dialing an outside line prefix).
dialout = 500
