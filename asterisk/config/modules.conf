; modules.conf - which modules are loaded at startup.
;
; Module prefixes: chan_ (channel drivers), app_ (dialplan applications),
; func_ (dialplan functions), res_ (resources), pbx_ (dialplan engines),
; cdr_/cel_ (call records), codec_ (transcoders), format_ (file formats),
; bridge_ (bridging technologies).
;
; Check the result with "module show" and "module show like <name>".

[modules]
; Load every module found in astmoddir, except the ones listed with noload.
; Simple for learning; production setups often use autoload=no plus an
; explicit "load =>" list (closer to Kamailio's loadmodule approach).
autoload = yes

;------------------------------------------------------------------------------
; Not configured YET: enabled in the week they are needed, together with
; their config file. Remove the noload line on that day.
;------------------------------------------------------------------------------
noload => res_musiconhold.so    ; week 3 (musiconhold.conf)
noload => app_voicemail.so      ; week 3 (voicemail.conf)
noload => app_queue.so          ; week 5 (queues.conf)
noload => res_odbc.so           ; week 6 (res_odbc.conf) and its dependents:
noload => res_odbc_transaction.so
noload => res_config_odbc.so
noload => cdr_odbc.so
noload => cdr_adaptive_odbc.so
noload => cel_odbc.so
noload => func_odbc.so
noload => res_prometheus.so     ; week 6 (prometheus.conf, metrics for Grafana)
noload => cdr_manager.so        ; week 7 (CDR events over AMI)
noload => cel_manager.so        ; week 7

;------------------------------------------------------------------------------
; Not used in this lab
;------------------------------------------------------------------------------
; Other channel drivers (only PJSIP here).
noload => chan_iax2.so          ; IAX2 protocol (Asterisk-to-Asterisk trunks)
noload => chan_websocket.so     ; media over WebSocket
noload => chan_unistim.so       ; Nortel UNISTIM phones (if built)
noload => chan_skinny.so        ; Cisco SCCP phones (if built)
noload => chan_mgcp.so          ; MGCP gateways (if built)

; Applications.
noload => app_agent_pool.so     ; AgentLogin agents (app_queue members are used instead)
noload => app_amd.so            ; answering machine detection (outbound dialers)
noload => app_confbridge.so     ; conference rooms
noload => app_page.so           ; paging (needs confbridge)
noload => app_followme.so       ; find-me/follow-me
noload => app_minivm.so         ; minimal voicemail (we will use app_voicemail)
noload => app_festival.so       ; text-to-speech via Festival
noload => app_alarmreceiver.so  ; alarm panels
noload => app_adsiprog.so       ; ADSI (analog screen phones), deprecated
noload => app_getcpeid.so       ; ADSI, deprecated
noload => res_adsi.so           ; ADSI, deprecated

; Dialplan engines: only pbx_config (extensions.conf). AEL and Lua not used.
noload => pbx_ael.so
noload => pbx_dundi.so          ; DUNDi peer-to-peer route lookup

; Resources.
noload => res_parking.so        ; call parking
noload => res_calendar.so       ; calendar integration
noload => res_clialiases.so     ; CLI command aliases
noload => res_config_ldap.so    ; LDAP realtime config
noload => res_config_sqlite3.so ; SQLite realtime config
noload => res_stun_monitor.so   ; STUN (no NAT discovery needed on the LAN)
noload => res_statsd.so         ; StatsD metrics (Prometheus instead, week 6)
noload => res_geolocation.so    ; SIP geolocation (emergency calls)
noload => res_pjsip_geolocation.so
noload => res_pjsip_config_wizard.so ; pjsip_wizard.conf shortcut syntax
noload => res_pjsip_notify.so   ; send NOTIFY to phones (pjsip_notify.conf)
noload => res_pjsip_phoneprov_provider.so
noload => res_phoneprov.so      ; HTTP phone provisioning
noload => res_aeap.so           ; external speech engines (AEAP)
noload => res_speech_aeap.so
noload => res_http_media_cache.so ; play sounds from HTTP URLs
noload => res_smdi.so           ; SMDI link to analog voicemail systems

; Call records: only CSV (cdr_csv) for now.
noload => cdr_custom.so
noload => cdr_sqlite3_custom.so
noload => cel_custom.so
noload => cel_sqlite3_custom.so

; Homer/HEP capture. res_hep sends SIP/RTCP copies to a Homer server, like
; Kamailio's siptrace with HEP. Could be enabled if a Homer container is added.
noload => res_hep.so
noload => res_hep_pjsip.so
noload => res_hep_rtcp.so
